# Builds the site (web/) and publishes it on GitHub Pages, on every push to main (or by hand, from the
# Actions tab). In the repo: Settings > Pages > Source: GitHub Actions.
# Work happens on develop and the feature branches; merging develop into main is what goes live.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits for the running one instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The project's Node (doc/stack.md): web/.npmrc has engine-strict, package.json wants >= 22.12
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Static site, every route prerendered (adapter-static) into web/build
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
